let LANG=localStorage.getItem('unem_lang')==='fr'?'fr':'ar';
const t=(k,...a)=>{const v=(I18N[LANG][k]!==undefined?I18N[LANG][k]:I18N.ar[k]);return typeof v==='function'?v(...a):v};
const KIND_KEYS=['question','help','discussion','announcement'];

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let sb;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let TK=localStorage.getItem('unem_community_token');if(!TK||TK.length<30){TK=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('unem_community_token',TK)}
let me=null,tab='posts',fKind='',timer=null,room=null,lastId=0,saved=JSON.parse(localStorage.getItem('unem_community_saved')||'[]');
const ERR_KEYS=['rate','report_rate','banned','full','empty','not_member'];
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._h);e._h=setTimeout(()=>e.style.display='none',2800)}
async function api(a,args={}){if(!sb)throw Error('offline');const{data,error}=await sb.rpc('community_api',{p_token:TK,p_action:a,p_args:args});if(error)throw error;return data}
async function run(a,args,ok){try{const d=await api(a,args);if(d&&d.need_register){setTimeout(needLogin,0);return null}if(ok)ok(d);return d}catch(e){const m=String(e.message||e),k=ERR_KEYS.find(k=>m.includes(k));toast(k?t('e_'+k):(/community_api|PGRST202|schema cache/.test(m)?t('e_setup'):t('e_conn')));return null}}
const ago=x=>{const m=Math.max(1,Math.round((Date.now()-new Date(x))/6e4));return m<60?t('ago_m',m):m<1440?t('ago_h',Math.round(m/60)):t('ago_d',Math.round(m/1440))};
const av=(n,image)=>image&&/^data:image\/(jpeg|png|webp);base64,/.test(image)?`<div class="av" style="overflow:hidden;background:#e2e8f0"><img src="${image}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`:`<div class="av" style="background:hsl(${[...String(n)].reduce((s,c)=>s+c.charCodeAt(0),0)*37%360} 45% 32%)">${esc(String(n||'?')[0])}</div>`;
const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}"${k==sel?' selected':''}>${v}</option>`).join('');
const lv=Object.fromEntries(LEVELS.map(l=>[l,l]));

function sheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('open')}const shut=()=>$('#ov').classList.remove('open');$('#ov').onclick=e=>{if(e.target.id==='ov')shut()};

function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;if(k==='me'&&me&&me.name)return;e.textContent=t(k)});
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $('#h1').innerHTML=t('h1');$('#copyright').textContent=t('copyright');$('#langBtn').textContent=t('langBtn');
  (function(h){
    if(me&&me.name&&!me.admin){
      h.innerHTML='<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9.5"/><path d="M7.8 12.4l3 3 5.4-6"/></svg>';
      h.appendChild(document.createTextNode(t('hello',me.name)));
    }else h.textContent=me&&me.name?'🛡️ '+t('adminBadge'):'';
  })($('#hello'));$('#hello').style.display=me&&me.name?'':'none';
  if(me&&me.name)$('#meName').textContent=me.name;
}
$('#langBtn').onclick=()=>{LANG=LANG==='ar'?'fr':'ar';localStorage.setItem('unem_lang',LANG);try{if(typeof window.setLanguage==='function')window.setLanguage(LANG)}catch(e){}applyLang();if(me&&me.name)render()};

function profile(){
  const st=(window.UNEM_STUDENT||{}),reg=st.reg?`<label>${t('pReg')}</label><input value="${esc(st.reg)}" readonly dir="ltr" style="text-align:start">`:'';
  sheet(`<h3>${t('profile')}</h3><label>${t('pName')}</label><input value="${esc(me?.name||'')}" readonly>${reg}
<div class="row"><div><label>${t('pSpec')}</label><input value="${esc(SPECS[me?.spec]||me?.spec||'')}" readonly></div><div><label>${t('pLevel')}</label><input value="${esc(me?.level||'')}" readonly></div></div>
<p class="note">${t('pNote')}</p><label>${t('avatar')}</label><div class="ph" style="margin:8px 0">${av(me?.name,me?.avatar_data)}<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"></div><p class="note">${t('avatarHint')}</p><button class="btn alt" id="avatarSave" type="button">${t('avatarSave')}</button><div class="row" style="margin-top:10px"><button class="btn alt" id="pOut" type="button">${t('pSwitch')}</button><button class="btn" id="pOk" type="button">${t('pClose')}</button></div>`);
  $('#pOk').onclick=shut;
  $('#avatarSave').onclick=async()=>{const f=$('#avatarFile').files?.[0];if(!f)return toast(t('e_empty'));if(f.size>1024*1024)return toast(t('avatarHint'));try{const data=await new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),size=320;c.width=size;c.height=size;const ctx=c.getContext('2d'),side=Math.min(im.width,im.height),x=(im.width-side)/2,y=(im.height-side)/2;ctx.drawImage(im,x,y,side,side,0,0,size,size);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=url});const out=await api('avatar',{data});if(out?.avatar_data)me.avatar_data=out.avatar_data;toast(t('avatarOk'));profile()}catch(e){toast(t('e_conn'))}};
  $('#pOut').onclick=()=>{if(!confirm(t('pSwitchQ')))return;shut();me=null;if(window.UNEM_GATE)window.UNEM_GATE.logout(true);else{localStorage.removeItem('unem_student');location.href='/'}};
}
$('#meBtn').onclick=()=>{if(me&&me.id)profile()};
function needLogin(){
  localStorage.removeItem('unem_student');clearInterval(timer);

}
const BASE_TABS=[['posts','t_posts','fa-newspaper'],['rooms','t_rooms','fa-hashtag'],['groups','t_groups','fa-users'],['partner','t_partner','fa-handshake'],['dms','t_dms','fa-comments']];

function postCard(p,partner){const sv=saved.includes(p.id),K=KINDS();return `<div class="card" id="p${p.id}"><div class="ph">${av(p.an,p.avatar)}<div style="flex:1"><b>${esc(p.an)}</b>${partner?'':`<span class="tag ${p.kind}">${K[p.kind]||''}</span>`}<small>${ago(p.t)} · ${SPECS[p.spec]||''} · ${p.level||''}${p.subject?' · '+esc(p.subject):''}</small></div>${p.can_del?`<button class="btn sm alt" title="${t('del')}" onclick="delPost('${p.id}')"><i class="fas fa-trash"></i></button>`:''}</div><div class="body">${esc(p.body)}</div><div class="acts">${partner?`<button data-id="${esc(p.aid)}" data-name="${esc(p.an)}" onclick="openDmEl(this)"><i class="fas fa-paper-plane"></i> ${t('reply')}</button>${!me?.admin&&p.aid!==me?.id?repBtn('post',p.id,p.aid,p.an):''}`:`<button class="${p.liked?'on':''}" onclick="like('${p.id}')"><i class="fas fa-heart"></i> ${p.likes}</button><button onclick="cms('${p.id}')"><i class="fas fa-comment"></i> ${p.comments}</button><button class="${sv?'on':''}" onclick="save('${p.id}')" style="margin-inline-start:auto"><i class="fas fa-bookmark"></i></button>${!me?.admin&&p.aid!==me?.id?repBtn('post',p.id,p.aid,p.an):''}`}</div><div id="c${p.id}"></div></div>`}
async function vPosts(){const d=await run('feed',{kind:fKind});if(!d)return $('#main').innerHTML=`<div class="empty">${t('failPosts')}</div>`;const K=KINDS();

const repBtn=(kind,target,aid,an)=>`<button type="button" class="rep" data-k="${esc(kind)}" data-t="${esc(target)}" data-a="${esc(aid||'')}" data-n="${esc(an||'')}" onclick="event.stopPropagation();reportEl(this)"><i class="fas fa-flag"></i> ${t('reportBtn')}</button>`;
function reportEl(el){const d=el.dataset;reportMenu(d.k,d.t,d.a,d.n)}
function reportMenu(kind,target,aid,an){
  const canStudent=kind!=='student'&&aid&&aid!==me?.id;
  sheet(`<h3><i class="fas fa-flag" style="color:#e11d48"></i> ${t('reportTitle')}</h3>${canStudent?`<div class="rep-opts"><label class="rep-opt"><input type="radio" name="repw" value="content" checked><span>${t('reportThisContent')}</span></label><label class="rep-opt"><input type="radio" name="repw" value="student"><span>${t('reportThisStudent',esc(an))}</span></label></div>`:''}<label>${t('reportQ')}</label><textarea id="repR" maxlength="300"></textarea><p class="note">${t('reportHint')}</p><div class="row" style="margin-top:10px"><button class="btn alt" id="repC" type="button">${t('reportCancel')}</button><button class="btn rep-send" id="repS" type="button"><i class="fas fa-paper-plane"></i> ${t('reportSend')}</button></div>`);
  $('#repC').onclick=shut;
  $('#repS').onclick=()=>{const w=document.querySelector('input[name=repw]:checked')?.value||'content',k=w==='student'?'student':kind,tg=w==='student'?aid:target;$('#repS').disabled=true;run('report',{kind:k,target:String(tg),reason:$('#repR').value.trim()},()=>{shut();toast(t('reportOk'))}).then(d=>{if(d===null)$('#repS').disabled=false})}
}
const report=(kind,target)=>reportMenu(kind,target,'','');
async function cms(id){const box=$('#c'+id);if(box.innerHTML)return box.innerHTML='';const d=await run('comments',{id});if(!d)return;box.innerHTML=d.map(c=>`<div class="cm"><div class="ph">${av(c.an,c.avatar)}<div style="flex:1"><b>${esc(c.an)}</b> <small style="color:var(--mut)">${ago(c.t)}</small></div>${c.can_del?`<a href="#" onclick="delCm('${c.id}','${id}');return false" style="color:#e11d48;font-weight:700">${t('del')}</a>`:''}${!me?.admin&&c.aid!==me?.id?repBtn('comment',c.id,c.aid,c.an):''}</div><div>${esc(c.body)}</div></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="ci${id}" maxlength="1000" placeholder="${t('cmPh')}"><button class="btn sm" style="flex:none" onclick="addCm('${id}')"><i class="fas fa-paper-plane"></i></button></div>`}
const bump=(id,n)=>{const b=document.querySelector(`#p${id} .acts button:nth-child(2)`);if(b)b.lastChild.textContent=' '+Math.max(0,(parseInt(b.textContent)||0)+n)};
const addCm=id=>{const body=$('#ci'+id).value.trim();if(!body)return;run('comment',{id,body},()=>{bump(id,1);$('#c'+id).innerHTML='';cms(id)})};
const delCm=(id,pid)=>run('del_comment',{id},()=>{bump(pid,-1);$('#c'+pid).innerHTML='';cms(pid)});
const ROOM_ICONS={BA:['fa-calculator','#1d4ed8'],FC:['fa-coins','#047857'],TCM:['fa-chart-line','#7c3aed'],GRH:['fa-people-group','#be185d'],SAE:['fa-briefcase','#b45309'],IG:['fa-laptop-code','#0369a1'],MASTER_FC:['fa-graduation-cap','#0f766e'],MASTER_IG:['fa-microchip','#4338ca']};
function roomVisual(r){if(r==='general')return ['fa-comments','#0f766e'];if(r.startsWith('group:'))return ['fa-people-group','#7c3aed'];if(r.startsWith('dm:'))return ['fa-user-group','#be185d'];if(r.startsWith('spec:'))return ROOM_ICONS[r.slice(5)]||['fa-book-open','#1d4ed8'];return ['fa-comments','#475569']}
function roomMarkLabel(r,title){if(r==='general')return 'UNEM';if(r.startsWith('spec:')){const k=r.slice(5);return k==='MASTER_FC'?'M.FC':k==='MASTER_IG'?'M.IG':k.slice(0,6)}if(r.startsWith('group:'))return String(title||'').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,4).toUpperCase()||'GRP';if(r.startsWith('dm:'))return 'DM';return 'ROOM'}
function roomMark(r,title,header){const [ic,color]=roomVisual(r),label=roomMarkLabel(r,title);return `<div ${header?'id="chIcon" ':''}class="ic room-logo${header?' room-head-logo':''}" style="background:linear-gradient(145deg,${color},${color});color:#fff" aria-label="${esc(title||label)}" title="${esc(title||label)}"><i class="fas ${ic}" aria-hidden="true"></i><small>${esc(label)}</small></div>`}
function roomTitle(r,d){if(r==='general')return t('roomGen');if(r.startsWith('spec:')){const k=r.slice(5),v=SPECS[k]||k;return t('roomX',v)}if(r.startsWith('group:'))return (d.groups||[]).find(g=>'group:'+g.id===r)?.name||t('gStudy');if(r.startsWith('dm:'))return (d.rooms||[]).find(x=>x.room===r)?.title||t('roomDM');return r}
function roomEntry(x,d,admin){const title=roomTitle(x.room,d),sub=x.room==='general'?t('roomGenD'):x.room.startsWith('spec:')?t('roomXD',SPECS[x.room.slice(5)]||x.room.slice(5)):x.room.startsWith('group:')?(d.groups||[]).find(g=>'group:'+g.id===x.room)?.subject||t('gStudy'):x.room.startsWith('dm:')?t('roomDM'):'';const meta=admin?[t('roomCount',x.messages||0),x.last_t?ago(x.last_t):''].filter(Boolean).join(' · '):sub;return `<div class="card li" data-room="${esc(x.room)}" data-title="${esc(title)}" data-sub="${esc(meta)}" onclick="openChatEl(this)">${roomMark(x.room,title)}<div><b>${esc(title)}</b><small>${esc(meta)}</small></div><i class="fas ${nxt()}"></i></div>`}
async function vRooms(){if(me?.admin){const d=await run('admin_list');if(!d)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;$('#main').innerHTML=`<p class="note">${t('adminAllNote')}</p>${(d.rooms||[]).map(x=>roomEntry(x,d,true)).join('')||`<div class="empty">${t('noAdmin')}</div>`}`;return}const k=me.spec,v=SPECS[k]||k;const r=[{room:'general'},{room:'spec:'+k}];$('#main').innerHTML=`<p class="note">${t('roomNote')}</p>`+r.map(x=>roomEntry(x,{},false)).join('')}
let gF={spec:'',level:''};
async function vGroups(){let d;if(me?.admin){const x=await run('admin_list');d=x&&x.groups||[]}else d=await run('groups',gF);if(!d)return $('#main').innerHTML=`<div class="empty">${t('failGroups')}</div>`;
if(me?.admin){$('#main').innerHTML=`<p class="note">${t('adminAllNote')}</p><h3>${t('adminAllGroups')}</h3>`+(d.length?d.map(g=>`<div class="card li">${roomMark('group:'+g.id,g.name)}<div><b>${esc(g.name)}</b><small>${esc(g.subject||'')} · ${esc(SPECS[g.spec]||g.spec)} · ${esc(g.level)}</small><small>${esc(g.descr||'')}</small></div><button class="btn sm" onclick="openAdminRoom('group:${g.id}')">${t('adminOpenRoom')}</button></div>`).join(''):`<div class="empty">${t('noGroups')}</div>`);return}
$('#main').innerHTML=`<div class="card"><b>${SPECS[me.spec]||me.spec} · ${me.level}</b><p class="note">${LANG==='fr'?'Seuls les groupes de votre filière et de votre niveau sont affichés.':'تظهر لك مجموعات تخصصك ومستواك فقط.'}</p></div><button class="btn" style="margin:10px 0" onclick="groupForm()">${t('newGroup')}</button>`+(d.length?d.map(g=>`<div class="card li" data-id="${g.id}" data-j="${g.joined?1:0}" data-n="${esc(g.name)}" data-s="${esc((g.spec||'')+' · '+(g.level||'')+' · '+t('membersOf',g.members,g.max))}" onclick="openGroupEl(this)">${roomMark('group:'+g.id,g.name)}<div><b>${esc(g.name)}</b><small>${esc(g.subject||'')} ${SPECS[g.spec]||''} · ${g.level||''}</small><small>${t('membersOf',g.members,g.max)}${g.descr?' — '+esc(g.descr):''}</small></div><span class="btn sm ${g.joined?'alt':''}">${g.joined?t('open'):t('join')}</span></div>`).join(''):`<div class="empty"><i class="fas fa-users fa-2x"></i><p>${t('noGroups')}</p></div>`)}
function groupForm(){sheet(`<h3>${t('gTitle')}</h3><label>${t('gName')}</label><input id="gN" maxlength="60" placeholder="${t('gNamePh')}"><label>${t('gSubj')}</label><input id="gSu" maxlength="60" placeholder="${t('gSubjPh')}">
<div class="row"><div><label>${t('gMax')}</label><input id="gM" type="number" min="2" max="30" value="10"></div><div><label>${t('gLevel')}</label><input id="gL" value="${esc(me.level||'')}" readonly></div><div><label>${t('gSpec')}</label><input id="gS" value="${esc(SPECS[me.spec]||me.spec||'')}" readonly></div></div>
<label>${t('gDesc')}</label><textarea id="gD" maxlength="300" placeholder="${t('gDescPh')}"></textarea><button class="btn" style="margin-top:10px" id="gOk">${t('gCreate')}</button>`);
$('#gOk').onclick=()=>{const name=$('#gN').value.trim();if(name.length<2)return toast(t('gNameErr'));run('group_new',{name,subject:$('#gSu').value,max:+$('#gM').value||10,level:me.level,spec:me.spec,descr:$('#gD').value},d=>{shut();openChat('group:'+d.id,name,t('gStudy'))})}}
function openGroupEl(el){const id=el.dataset.id,name=el.dataset.n,sub=el.dataset.s;if(el.dataset.j==='1')return openChat('group:'+id,name,sub);run('group_join',{id},()=>openChat('group:'+id,name,sub))}
let pF={spec:'',level:'',subject:''};
async function vPartner(){let d;if(me?.admin){const x=await run('admin_list');d=x&&(x.posts||[]).filter(p=>p.kind==='partner').map(p=>({...p,can_del:true}))||[]}else d=await run('feed',{kind:'partner',...pF});if(!d)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;
if(me?.admin){$('#main').innerHTML=`<p class="note">${t('adminAllNote')}</p><h3>${t('adminAllRequests')}</h3>`+(d.length?d.map(p=>postCard(p,1)).join(''):`<div class="empty">${t('noPartner')}</div>`);return}
$('#main').innerHTML=`<div class="card"><b><i class="fas fa-handshake"></i> ${t('pFind')}</b><div class="card" style="padding:8px;margin:8px 0"><b>${esc(SPECS[me.spec]||me.spec)} · ${esc(me.level)}</b></div><input id="qSu" maxlength="60" placeholder="${t('pSubjPh')}"><textarea id="qB" maxlength="300" style="margin-top:8px" placeholder="${t('pBodyPh')}"></textarea><button class="btn" style="margin-top:8px" onclick="newPartner()">${t('pPost')}</button><p class="note">${t('pHint')}</p></div><div style="height:10px"></div>${d.length?d.map(p=>postCard(p,1)).join(''):`<div class="empty">${t('noPartner')}</div>`}`}
async function vAdmin(){if(!me?.admin)return;const d=await run('admin_list');if(!d)return;
const del=(type,id)=>`<button class="btn sm alt" onclick="adminDelete('${type}','${esc(id)}')"><i class="fas fa-trash"></i> ${t('del')}</button>`;
const post=(d.posts||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${esc(KINDS()[x.kind]||x.kind)}</b><small>${esc(SPECS[x.spec]||x.spec)} · ${esc(x.level)}</small><div class="body">${esc(x.body)}</div>${del('post',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const groups=(d.groups||[]).map(x=>`<div class="card li"><div><b>${esc(x.name)}</b><small>${esc(SPECS[x.spec]||x.spec)} · ${esc(x.level)}</small></div>${del('group',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const msgs=(d.messages||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${esc(x.room)}</b><div class="body">${esc(x.body)}</div>${del('message',x.id)} <button class="btn sm alt" onclick="adminClearRoom('${esc(x.room)}')">${t('clearRoom')}</button></div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const comments=(d.comments||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${ago(x.t)}</b><div class="body">${esc(x.body)}</div>${del('comment',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const reports=(d.reports||[]).map(x=>`<div class="card"><b>${esc(x.kind||'')}</b>${x.target_name?` · ${esc(x.target_name)}`:''}<div class="body">${esc(x.target_content||x.target||'')}<br>${esc(x.reason||'')}</div>${del('report',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const rooms=(d.rooms||[]).map(x=>`<div class="card li"><div><b>${esc(x.room)}</b><small>${x.messages} · ${ago(x.last_t)}</small></div><button class="btn sm" onclick="openAdminRoom('${esc(x.room)}')">${t('adminOpenRoom')}</button> <button class="btn sm alt" onclick="adminClearRoom('${esc(x.room)}')">${t('clearRoom')}</button></div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
$('#main').innerHTML=`<button class="btn" onclick="render()">${t('adminRefresh')}</button><h3>${t('adminPosts')}</h3>${post}<h3>${t('adminGroups')}</h3>${groups}<h3>${t('adminMessages')}</h3>${msgs}<h3>${t('adminRooms')}</h3>${rooms}<h3>${t('adminComments')}</h3>${comments}<h3>${t('adminReports')}</h3>${reports}`}
window.openAdminRoom=function(r){if(!me?.admin)return;openChat(r,r,'');const b=$('#chClear');if(b){b.hidden=false;b.onclick=()=>adminClearRoom(r)}};
window.adminDelete=(type,id)=>{if(!me?.admin||!confirm(t('adminDeleteQ')))return;run('admin_delete',{type,id},()=>{if(type==='message'&&room){const el=document.querySelector('[data-message-id="'+CSS.escape(String(id))+'"]');if(el)el.remove();}else render()})};
window.adminClearRoom=r=>{if(!me?.admin||!confirm(t('adminDeleteQ')))return;run('admin_delete',{type:'room',room:r},()=>{if(room===r)closeChat();render()})};
async function vDms(){if(me?.admin){const x=await run('admin_list');if(!x)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;const d=(x.rooms||[]).filter(r=>r.room.startsWith('dm:'));$('#main').innerHTML=`<p class="note">${t('adminAllNote')}</p>`+(d.length?d.map(r=>`<div class="card li" data-room="${esc(r.room)}" data-title="${esc(r.title||t('roomDM'))}" data-sub="${esc(t('roomCount',r.messages||0))}" onclick="openChatEl(this)">${roomMark(r.room,r.title||t('roomDM'))}<div><b>${esc(r.title||t('roomDM'))}</b><small>${esc(t('roomCount',r.messages||0))}${r.last_t?' · '+ago(r.last_t):''}</small></div><i class="fas ${nxt()}"></i></div>`).join(''):`<div class="empty"><i class="fas fa-comments fa-2x"></i><p>${t('noDms')}</p></div>`);return}const d=await run('dms');if(!d)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;$('#main').innerHTML=d.length?d.map(x=>`<div class="card li" data-id="${esc(x.other)}" data-name="${esc(x.an)}" onclick="openDmEl(this)">${av(x.an,x.avatar)}<div><b>${esc(x.an)}</b><small>${esc(x.body.slice(0,60))} · ${ago(x.t)}</small></div>${repBtn('student',x.other,x.other,x.an)}</div>`).join('')+`<p class="note">${t('dmNote')}</p>`:`<div class="empty"><i class="fas fa-comments fa-2x"></i><p>${t('noDms')}</p></div>`}
function openDmEl(el){openDm(el.dataset.id,el.dataset.name)}
function openDm(id,name){if(id===me.id)return toast(t('itsYou'));openChat('dm:'+[me.id,id].sort().join(':'),name,t('dmSub'))}
function openChatEl(el){openChat(el.dataset.room,el.dataset.title,el.dataset.sub)}
function openChat(r,ti,s){room=r;lastId=0;$('#chIcon').outerHTML=roomMark(r,ti,true);$('#chT').textContent=ti;$('#chS').textContent=s;$('#msgs').innerHTML='';const cb=$('#chClear');cb.hidden=!(me&&me.admin);if(me&&me.admin)cb.onclick=()=>adminClearRoom(r);$('#chat').classList.add('open');pull();clearInterval(timer);timer=setInterval(pull,4000)}
function closeChat(){$('#chat').classList.remove('open');clearInterval(timer);room=null;if(tab==='groups'||tab==='dms')render()}
async function pull(){if(!room||document.hidden)return;const r=room,d=await api('msgs',{room:r,after:lastId}).catch(()=>null);if(!d||d.need_register||r!==room||!d.length)return;const box=$('#msgs'),down=box.scrollHeight-box.scrollTop-box.clientHeight<80||!lastId;d.forEach(m=>{lastId=Math.max(lastId,m.id);const name=m.an||me.name,avatar=m.mine?me.avatar_data:m.avatar;box.insertAdjacentHTML('beforeend',`<div class="m ${m.mine?'me':''}" data-message-id="${m.id}"><div class="ph">${av(name,avatar)}<b data-id="${esc(m.aid)}" data-name="${esc(name)}" onclick="openDmEl(this)">${esc(name)}</b></div><div>${esc(m.body)}</div>${!me?.admin&&!m.mine&&m.aid!==me?.id?`<div class="mrep">${repBtn('message',m.id,m.aid,name)}</div>`:''}${me?.admin?`<button type="button" class="btn sm alt" onclick="adminDelete('message','${m.id}')" title="${t('adminMsgDelete')}"><i class="fas fa-trash"></i></button>`:''}</div>`)});if(down)box.scrollTop=box.scrollHeight}
async function sendMsg(){const i=$('#chIn'),body=i.value.trim();if(!body||!room)return;i.value='';const d=await run('send',{room,body});if(d)pull();else i.value=body}
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
/* توقيع MDA: 3 نقرات سريعة تُظهر رسالة (مثل الصفحة الرئيسية) */
(function(){const s=document.querySelector('.mda-sign');if(!s)return;let n=0,h;s.addEventListener('click',()=>{n++;clearTimeout(h);h=setTimeout(()=>n=0,900);if(n>=3){n=0;toast(t('sign'))}})})();
applyLang();
async function boot(){try{const d=await api('me');if(d&&!d.need_register){me=d;if(me.admin){try{window.UNEM_GATE&&window.UNEM_GATE.staffPass&&window.UNEM_GATE.staffPass()}catch(e){}}applyLang();render()}else{try{localStorage.removeItem('unem_gate_staff')}catch(e){}needLogin()}}catch(e){const m=String(e.message||e);$('#main').innerHTML=`<div class="empty"><i class="fas fa-triangle-exclamation fa-2x"></i><p>${/community_api|PGRST202|schema cache/.test(m)?t('setupFail'):t('connFail')}</p></div>`}}
window.addEventListener('unem:student',()=>{if(!me)boot()});   /* بعد دخول الطالب من البوابة */
boot();
</script></body></html>
