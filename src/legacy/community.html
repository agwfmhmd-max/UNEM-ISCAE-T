<style>
:root{--g:#0f5132;--g2:#15803d;--gold:#f5b942;--bg:#f1f5f4;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--mine:#fef3c7}
body.dark-mode{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--soft:#0f172a;--mine:#5b4a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}main.wrap{width:100%;flex:1;padding-bottom:24px}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top a,.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.85rem}

.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-1px 0 12px;padding:10px 12px 0;background:var(--g);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.tabs button.on{background:var(--bg);color:var(--g)}body.dark-mode .tabs button.on{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.78rem;font-weight:700;cursor:pointer}.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}body.dark-mode .chip.on{background:var(--gold);color:#1e293b}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;outline:none}textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}

.empty{text-align:center;color:var(--mut);padding:30px 10px}.note{font-size:.72rem;color:var(--mut);margin-top:8px}

.sheet{background:var(--card);width:min(560px,100%);border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheet h3{margin:0 0 10px}.sheet label{font-size:.78rem;font-weight:700;display:block;margin:8px 0 4px}

.ch{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}.ch button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.ch small{opacity:.75;display:block;font-size:.72rem}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:80%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 11px;align-self:flex-start;word-break:break-word;white-space:pre-wrap}.m.me{background:var(--mine);align-self:flex-end}.m b{display:block;font-size:.7rem;color:var(--mut);cursor:pointer}
.sb{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.sb button{width:46px;border:0;border-radius:12px;background:var(--gold);cursor:pointer}

.top .grp{display:flex;gap:6px;align-items:center}
.hello{margin:10px 0 0!important;font-weight:800;font-size:.95rem!important;color:var(--gold)}
[dir=ltr] .ic-flip{transform:scaleX(-1)}
/* تذييل المجتمع + ختم MDA (نفس الصفحة الرئيسية) */
.main-footer{background:#064e3b;color:#fff;padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));text-align:center;border-radius:20px 20px 0 0;margin-top:auto;position:relative;overflow:hidden;box-shadow:0 -10px 25px rgba(0,0,0,.1);flex-shrink:0}

.room-logo{width:44px;height:44px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:14px;color:#fff;box-shadow:0 5px 12px rgba(15,23,42,.16),inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}.room-logo i{font-size:.96rem;line-height:1}.room-logo small{font-size:.48rem;line-height:1;font-weight:900;letter-spacing:.035em;color:#fff;opacity:.96}.room-head-logo{width:40px;height:40px;border-radius:12px}.m .av{width:26px;height:26px;font-size:.68rem}.m .ph{gap:6px}.cm .av{width:24px;height:24px;font-size:.65rem}.cm .ph{gap:6px}

/* ================= تصميم المجتمع المحسّن (UI v2) ================= */
:root{--shadow:0 10px 30px rgba(15,81,50,.09);--shadow2:0 16px 40px rgba(15,81,50,.16);--ring:rgba(21,128,61,.22)}

body{background:radial-gradient(900px 420px at 100% -80px,rgba(21,128,61,.10),transparent 60%),radial-gradient(700px 380px at -10% 20%,rgba(245,185,66,.10),transparent 60%),var(--bg);background-attachment:fixed}

.tabs{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);margin:0 0 14px;padding:12px 12px 10px;gap:8px;border-bottom:1px solid var(--line);box-shadow:0 8px 22px rgba(15,23,42,.05)}
.tabs button{border-radius:999px;background:var(--card);color:var(--mut);border:1px solid var(--line);padding:9px 16px;font-size:.88rem;box-shadow:0 2px 6px rgba(15,23,42,.04);transition:.2s}
.tabs button i{margin-inline-end:4px}

.card{border-radius:20px;box-shadow:var(--shadow);border:1px solid var(--line);transition:transform .2s,box-shadow .2s;animation:fadeUp .35s both}

.li:hover{transform:translateY(-2px)}

.av{width:42px;height:42px;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ring)}
.m .av{width:28px;height:28px;box-shadow:0 0 0 2px var(--card)}.cm .av{width:26px;height:26px;box-shadow:none}
.ph b{font-size:.96rem}
.body{font-size:.98rem;line-height:1.9}
.tag{font-size:.68rem;padding:3px 9px;border-radius:999px}

.btn.alt{background:var(--soft);box-shadow:none}
input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px var(--ring)}
.chip{transition:.15s}.chip:hover{border-color:var(--g2);color:var(--g2)}
.chip.on{background:linear-gradient(135deg,var(--g),var(--g2));border-color:transparent;color:#fff}body.dark-mode .chip.on{background:var(--gold);color:#1e293b}
.acts{align-items:center;gap:6px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.acts button{border-radius:999px;padding:6px 12px;transition:.15s}.acts button:hover{background:var(--soft)}
.empty{padding:40px 14px}.empty>i{display:grid;place-items:center;width:78px;height:78px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,rgba(21,128,61,.12),rgba(245,185,66,.18));color:var(--g2);font-size:1.8rem!important}
.li .ic{box-shadow:0 8px 16px rgba(15,23,42,.18)}
h3{font-size:1.02rem;margin:18px 2px 10px}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;line-height:1.7}
.sheet{border-radius:26px 26px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.25);animation:fadeUp .25s both}
.ov{backdrop-filter:blur(4px)}
/* المحادثة */
.ch{background:linear-gradient(135deg,#0a3d2a,#0f5132 60%,#15803d);box-shadow:0 8px 22px rgba(15,81,50,.3)}
#chat{background:radial-gradient(600px 300px at 100% 0,rgba(21,128,61,.08),transparent 60%),var(--bg)}

.rep{display:inline-flex;align-items:center;gap:6px;background:#fff1f2!important;color:#be123c!important;border:1.5px solid #fda4af!important;border-radius:999px!important;padding:6px 14px!important;font-weight:800;font-size:.8rem;cursor:pointer;margin-inline-start:auto;transition:.15s}

.cm{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.cm .ph{flex:1 1 100%}.cm>div:not(.ph){flex:1 1 100%}.cm .rep{padding:3px 10px!important;font-size:.7rem}

  const nm=side?`<span class="mn" style="color:hsl(${nameHue(name)} 55% 38%)" data-id="${esc(m.aid)}" data-name="${esc(name)}" onclick="openDmEl(this)">${esc(name)}</span>`:'';
  const own=mine?`<button type="button" class="mrp" data-id="${esc(m.id)}" onclick="editMsgEl(this)"><i class="fas fa-pen"></i> ${t('edit')}</button>${adm?'':`<button type="button" class="mrp" data-id="${esc(m.id)}" onclick="delMsgEl(this)"><i class="fas fa-trash"></i> ${t('del')}</button>`}`:'';
  const acts=`<div class="macts"><button type="button" class="mrp" data-id="${esc(m.id)}" data-n="${esc(name)}" data-b="${esc(String(m.body).slice(0,140))}" onclick="replyEl(this)"><i class="fas fa-reply"></i> ${t('replyMsg')}</button>${own}${!adm&&!mine&&m.aid!==me?.id?repBtn('message',m.id,m.aid,name):''}${adm?`${admRet('message',m.id,m.pin)}<button type="button" class="btn sm alt" onclick="adminDelete('message','${m.id}')" title="${t('adminMsgDelete')}"><i class="fas fa-trash"></i></button>`:''}</div>`;
  const meta=[];if(m.pin)meta.push(pinBadge());if(m.ed)meta.push(edTag());if(adm&&m.exp)meta.push(`<span class="ed-tag"><i class="fas fa-hourglass-half"></i> ${leftTxt(m.exp)}</span>`);
  return `<div class="mw${mine?' me':''}" data-message-id="${m.id}">${side?av(name,avatar):''}<div class="m${mine?' me':''}${m.pin?' pinned':''}">${nm}${quote}<div class="mt">${esc(m.body)}</div>${meta.length?`<div class="mmeta">${meta.join('')}</div>`:''}${acts}</div></div>`}
async function pull(){if(!room||document.hidden)return;const r=room,d=await api('msgs',{room:r,after:lastId}).catch(()=>null);
  if(d&&!d.need_register&&r===room&&d.length){const box=$('#msgs'),down=box.scrollHeight-box.scrollTop-box.clientHeight<80||!lastId,isDm=r.startsWith('dm:'),adm=!!(me&&me.admin);
    /* الصورة تصل مع آخر رسالة لكل كاتب فقط: نسجّلها أولاً ثم نرسم، فتظهر صورة الكاتب على كل رسائله وليس آخر رسالة فقط */
    d.forEach(m=>{const mine=!!m.mine;rem(m.aid,m.an||me.name,mine?null:m.avatar)});
    d.forEach(m=>{if(document.querySelector('[data-message-id="'+String(m.id).replace(/[^0-9]/g,'')+'"]')){lastId=Math.max(lastId,m.id);return}lastId=Math.max(lastId,m.id);MSGS[String(m.id)]=m;box.insertAdjacentHTML('beforeend',msgHtml(m,isDm,adm))});
    if(isDm)refreshHead();if(down)box.scrollTop=box.scrollHeight}
  if(r===room&&(++SYNC_N%2===0))syncMsgs(r)}
/* مزامنة التعديل/التثبيت/الحذف الذي تم من أي شخص آخر على الرسائل المعروضة */
async function syncMsgs(r){r=r||room;if(!r||r!==room)return;const ids=Object.keys(MSGS).slice(-150);if(!ids.length)return;
  const d=await api('msgs_sync',{room:r,ids}).catch(()=>null);if(!Array.isArray(d)||r!==room)return;
  const box=$('#msgs'),isDm=r.startsWith('dm:'),adm=!!(me&&me.admin),alive={};d.forEach(x=>alive[String(x.id)]=x);
  ids.forEach(id=>{const el=document.querySelector('[data-message-id="'+id.replace(/[^0-9]/g,'')+'"]'),x=alive[id];
    if(!x){if(el)el.remove();delete MSGS[id];return}
    const m=MSGS[id];if(!m||!el)return;
    if(m.body!==x.body||(m.ed||null)!==(x.ed||null)||!!m.pin!==!!x.pin||(adm&&(m.exp||null)!==(x.exp||null))){Object.assign(m,{body:x.body,ed:x.ed,pin:x.pin,exp:x.exp});el.outerHTML=msgHtml(m,isDm,adm)}})}
async function sendMsg(){const i=$('#chIn'),body=i.value.trim();if(!body||!room)return;i.value='';const args={room,body};if(RT)args.reply_to=RT.id;const d=await run('send',args);if(d){cancelReply();pull()}else i.value=body}
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});

(function(){const s=document.querySelector('.mda-sign');if(!s)return;let n=0,h;s.addEventListener('click',()=>{n++;clearTimeout(h);h=setTimeout(()=>n=0,900);if(n>=3){n=0;toast(t('sign'))}})})();
applyLang();
async function boot(){try{const d=await api('me');if(d&&!d.need_register){me=d;cacheAvatar();if(me.admin){try{window.UNEM_GATE&&window.UNEM_GATE.staffPass&&window.UNEM_GATE.staffPass()}catch(e){}}applyLang();render()}else{try{localStorage.removeItem('unem_gate_staff')}catch(e){}needLogin()}}catch(e){const m=String(e.message||e);$('#main').innerHTML=`<div class="empty"><i class="fas fa-triangle-exclamation fa-2x"></i><p>${/community_api|PGRST202|schema cache/.test(m)?t('setupFail'):t('connFail')}</p></div>`}}
