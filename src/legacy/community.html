const KINDS=()=>Object.fromEntries(KIND_KEYS.map(k=>[k,t(k)]));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(localStorage.getItem('unem_theme')==='dark')document.body.classList.add('dark-mode');
let sb;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let TK=localStorage.getItem('unem_community_token');if(!TK||TK.length<30){TK=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('unem_community_token',TK)}
let me=null,tab='posts',fKind='',timer=null,room=null,lastId=0,saved=JSON.parse(localStorage.getItem('unem_community_saved')||'[]');
const ERR_KEYS=['rate','banned','full','empty','not_member'];
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(e._h);e._h=setTimeout(()=>e.style.display='none',2800)}
async function api(a,args={}){if(!sb)throw Error('offline');const{data,error}=await sb.rpc('community_api',{p_token:TK,p_action:a,p_args:args});if(error)throw error;return data}
async function run(a,args,ok){try{const d=await api(a,args);if(d&&d.need_register){setTimeout(needLogin,0);return null}if(ok)ok(d);return d}catch(e){const m=String(e.message||e),k=ERR_KEYS.find(k=>m.includes(k));toast(k?t('e_'+k):(/community_api|PGRST202|schema cache/.test(m)?t('e_setup'):t('e_conn')));return null}}
const ago=x=>{const m=Math.max(1,Math.round((Date.now()-new Date(x))/6e4));return m<60?t('ago_m',m):m<1440?t('ago_h',Math.round(m/60)):t('ago_d',Math.round(m/1440))};
const av=(n,image)=>image&&/^data:image\/(jpeg|png|webp);base64,/.test(image)?`<div class="av" style="overflow:hidden;background:#e2e8f0"><img src="${image}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"></div>`:`<div class="av" style="background:hsl(${[...String(n)].reduce((s,c)=>s+c.charCodeAt(0),0)*37%360} 45% 32%)">${esc(String(n||'?')[0])}</div>`;
const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}"${k==sel?' selected':''}>${v}</option>`).join('');
const lv=Object.fromEntries(LEVELS.map(l=>[l,l]));
const nxt=()=>LANG==='ar'?'fa-chevron-left':'fa-chevron-right';
function sheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('open')}const shut=()=>$('#ov').classList.remove('open');$('#ov').onclick=e=>{if(e.target.id==='ov')shut()};
/* ===== اللغة ===== */
function applyLang(){
  document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';document.title=t('title');
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;if(k==='me'&&me&&me.name)return;e.textContent=t(k)});
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  $('#h1').innerHTML=t('h1');$('#copyright').textContent=t('copyright');$('#langBtn').textContent=t('langBtn');
  $('#hello').textContent=me&&me.name?(me.admin?t('adminBadge'):t('hello',me.name)):'';
  if(me&&me.name)$('#meName').textContent=me.name;
}
$('#langBtn').onclick=()=>{LANG=LANG==='ar'?'fr':'ar';localStorage.setItem('unem_lang',LANG);try{if(typeof window.setLanguage==='function')window.setLanguage(LANG)}catch(e){}applyLang();if(me&&me.name)render()};
/* ===== ملفي: الاسم والتخصص والمستوى من حساب الطالب (للقراءة فقط) ===== */
function profile(){
  const st=(window.UNEM_STUDENT||{}),reg=st.reg?`<label>${t('pReg')}</label><input value="${esc(st.reg)}" readonly dir="ltr" style="text-align:start">`:'';
  sheet(`<h3>${t('profile')}</h3><label>${t('pName')}</label><input value="${esc(me?.name||'')}" readonly>${reg}
<div class="row"><div><label>${t('pSpec')}</label><input value="${esc(SPECS[me?.spec]||me?.spec||'')}" readonly></div><div><label>${t('pLevel')}</label><input value="${esc(me?.level||'')}" readonly></div></div>
<p class="note">${t('pNote')}</p><label>${t('avatar')}</label><div class="ph" style="margin:8px 0">${av(me?.name,me?.avatar_data)}<input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"></div><p class="note">${t('avatarHint')}</p><button class="btn alt" id="avatarSave" type="button">${t('avatarSave')}</button><div class="row" style="margin-top:10px"><button class="btn alt" id="pOut" type="button">${t('pSwitch')}</button><button class="btn" id="pOk" type="button">${t('pClose')}</button></div>`);
  $('#pOk').onclick=shut;
  $('#avatarSave').onclick=async()=>{const f=$('#avatarFile').files?.[0];if(!f)return toast(t('e_empty'));if(f.size>1024*1024)return toast(t('avatarHint'));try{const data=await new Promise((resolve,reject)=>{const im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{const c=document.createElement('canvas'),size=320;c.width=size;c.height=size;const ctx=c.getContext('2d'),side=Math.min(im.width,im.height),x=(im.width-side)/2,y=(im.height-side)/2;ctx.drawImage(im,x,y,side,side,0,0,size,size);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=url});const out=await api('avatar',{data});if(out?.avatar_data)me.avatar_data=out.avatar_data;toast(t('avatarOk'));profile()}catch(e){toast(t('e_conn'))}};
  $('#pOut').onclick=()=>{if(!confirm(t('pSwitchQ')))return;shut();me=null;if(window.UNEM_GATE)window.UNEM_GATE.logout(true);else{localStorage.removeItem('unem_student');location.href='/'}};
}
$('#meBtn').onclick=()=>{if(me&&me.id)profile()};
function needLogin(){
  localStorage.removeItem('unem_student');clearInterval(timer);
  $('#main').innerHTML=`<div class="empty"><i class="fas fa-user-lock fa-2x"></i><h3>${t('needLoginT')}</h3><p>${t('needLoginD')}</p><button class="btn" style="max-width:260px" id="nlB" type="button">${t('needLoginB')}</button></div>`;
  $('#nlB').onclick=()=>{if(window.UNEM_GATE)window.UNEM_GATE.logout(true);else location.href='/'};
}
const BASE_TABS=[['posts','t_posts','fa-newspaper'],['rooms','t_rooms','fa-hashtag'],['groups','t_groups','fa-users'],['partner','t_partner','fa-handshake'],['dms','t_dms','fa-comments']];
function render(){const tabs=me&&me.admin?BASE_TABS.concat([['admin','t_admin','fa-shield-halved']]):BASE_TABS;$('#tabs').innerHTML=tabs.map(x=>`<button class="${x[0]==tab?'on':''}" onclick="tab='${x[0]}';render()"><i class="fas ${x[2]}"></i> ${t(x[1])}</button>`).join('');$('#main').innerHTML='<div class="empty"><i class="fas fa-spinner fa-spin"></i></div>';({posts:vPosts,rooms:vRooms,groups:vGroups,partner:vPartner,dms:vDms,admin:vAdmin})[tab]()}
function postCard(p,partner){const sv=saved.includes(p.id),K=KINDS();return `<div class="card" id="p${p.id}"><div class="ph">${av(p.an,p.avatar)}<div style="flex:1"><b>${esc(p.an)}</b>${partner?'':`<span class="tag ${p.kind}">${K[p.kind]||''}</span>`}<small>${ago(p.t)} · ${SPECS[p.spec]||''} · ${p.level||''}${p.subject?' · '+esc(p.subject):''}</small></div>
${p.can_del?`<button class="btn sm alt" onclick="delPost('${p.id}')"><i class="fas fa-trash"></i></button>`:`<button class="btn sm alt" onclick="report('post','${p.id}')"><i class="fas fa-flag"></i></button>`}</div><div class="body">${esc(p.body)}</div>
<div class="acts">${partner?`<button data-id="${esc(p.aid)}" data-name="${esc(p.an)}" onclick="openDmEl(this)"><i class="fas fa-paper-plane"></i> ${t('reply')}</button>`:`<button class="${p.liked?'on':''}" onclick="like('${p.id}')"><i class="fas fa-heart"></i> ${p.likes}</button><button onclick="cms('${p.id}')"><i class="fas fa-comment"></i> ${p.comments}</button><button class="${sv?'on':''}" onclick="save('${p.id}')" style="margin-inline-start:auto"><i class="fas fa-bookmark"></i></button>`}</div><div id="c${p.id}"></div></div>`}
async function vPosts(){const d=await run('feed',{kind:fKind});if(!d)return $('#main').innerHTML=`<div class="empty">${t('failPosts')}</div>`;const K=KINDS();
$('#main').innerHTML=`<div class="card"><div class="ph">${av(me.name)}<div><b>${t('share')}</b><small>${t('shareSub')}</small></div></div><div class="chips" id="nk">${Object.entries(K).map(([k,v],i)=>`<span class="chip${i?'':' on'}" data-k="${k}">${v}</span>`).join('')}</div>
<textarea id="nb" maxlength="3000" placeholder="${t('postPh')}"></textarea><button class="btn" style="margin-top:8px" onclick="newPost()"><i class="fas fa-paper-plane"></i> ${t('publish')}</button></div>
<div class="chips"><span class="chip${fKind?'':' on'}" onclick="fKind='';render()">${t('all')}</span>${Object.entries(K).map(([k,v])=>`<span class="chip${fKind==k?' on':''}" onclick="fKind='${k}';render()">${v}</span>`).join('')}</div>${d.length?d.map(p=>postCard(p)).join(''):`<div class="empty"><i class="fas fa-newspaper fa-2x"></i><p>${t('noPosts')}</p></div>`}`;
$('#nk').onclick=e=>{if(e.target.dataset.k){document.querySelectorAll('#nk .chip').forEach(c=>c.classList.remove('on'));e.target.classList.add('on')}}}
function newPost(){const body=$('#nb').value.trim(),k=$('#nk .on').dataset.k;if(!body)return toast(t('e_empty'));run('post',{kind:k,body},()=>render())}
const delPost=id=>confirm(t('delPostQ'))&&run('del_post',{id},()=>render());
const like=id=>run('like',{id},()=>render());
const save=id=>{saved=saved.includes(id)?saved.filter(x=>x!=id):[...saved,id];localStorage.setItem('unem_community_saved',JSON.stringify(saved));render()};
function report(kind,target){const reason=prompt(t('reportQ'));if(reason===null)return;run('report',{kind,target,reason},()=>toast(t('reportOk')))}
async function cms(id){const box=$('#c'+id);if(box.innerHTML)return box.innerHTML='';const d=await run('comments',{id});if(!d)return;
box.innerHTML=d.map(c=>`<div class="cm"><b>${esc(c.an)}</b> <small style="color:var(--mut)">${ago(c.t)}</small>${c.can_del?` <a href="#" onclick="delCm('${c.id}','${id}');return false" style="color:#e11d48">${t('del')}</a>`:''}<div>${esc(c.body)}</div></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="ci${id}" maxlength="1000" placeholder="${t('cmPh')}"><button class="btn sm" style="flex:none" onclick="addCm('${id}')"><i class="fas fa-paper-plane"></i></button></div>`}
const bump=(id,n)=>{const b=document.querySelector(`#p${id} .acts button:nth-child(2)`);if(b)b.lastChild.textContent=' '+Math.max(0,(parseInt(b.textContent)||0)+n)};
const addCm=id=>{const body=$('#ci'+id).value.trim();if(!body)return;run('comment',{id,body},()=>{bump(id,1);$('#c'+id).innerHTML='';cms(id)})};
const delCm=(id,pid)=>run('del_comment',{id},()=>{bump(pid,-1);$('#c'+pid).innerHTML='';cms(pid)});
function vRooms(){const k=me.spec,v=SPECS[k]||k;const r=[['general',t('roomGen'),t('roomGenD'),'#'],['spec:'+k,t('roomX',v),t('roomXD',v),String(v).replace('Master ','M-').slice(0,4)]];
$('#main').innerHTML=`<p class="note">${t('roomNote')}</p>`+r.map(x=>`<div class="card li" data-room="${esc(x[0])}" data-title="${esc(x[1])}" data-sub="${esc(x[2])}" onclick="openChatEl(this)"><div class="ic">${x[3]}</div><div><b>${esc(x[1])}</b><small>${esc(x[2])}</small></div><i class="fas ${nxt()}"></i></div>`).join('')}
let gF={spec:'',level:''};
async function vGroups(){const d=await run('groups',gF);if(!d)return $('#main').innerHTML=`<div class="empty">${t('failGroups')}</div>`;
$('#main').innerHTML=`<div class="card"><b>${SPECS[me.spec]||me.spec} · ${me.level}</b><p class="note">${LANG==='fr'?'Seuls les groupes de votre filière et de votre niveau sont affichés.':'تظهر لك مجموعات تخصصك ومستواك فقط.'}</p></div>
<button class="btn" style="margin:10px 0" onclick="groupForm()">${t('newGroup')}</button>`+(d.length?d.map(g=>`<div class="card li" data-id="${g.id}" data-j="${g.joined?1:0}" data-n="${esc(g.name)}" data-s="${esc((g.spec||'')+' · '+(g.level||'')+' · '+t('membersOf',g.members,g.max))}" onclick="openGroupEl(this)"><div class="ic"><i class="fas fa-users"></i></div><div><b>${esc(g.name)}</b><small>${esc(g.subject||'')} ${SPECS[g.spec]||''} · ${g.level||''}</small><small>${t('membersOf',g.members,g.max)}${g.descr?' — '+esc(g.descr):''}</small></div><span class="btn sm ${g.joined?'alt':''}">${g.joined?t('open'):t('join')}</span></div>`).join(''):`<div class="empty"><i class="fas fa-users fa-2x"></i><p>${t('noGroups')}</p></div>`)}
function groupForm(){sheet(`<h3>${t('gTitle')}</h3><label>${t('gName')}</label><input id="gN" maxlength="60" placeholder="${t('gNamePh')}"><label>${t('gSubj')}</label><input id="gSu" maxlength="60" placeholder="${t('gSubjPh')}">
<div class="row"><div><label>${t('gMax')}</label><input id="gM" type="number" min="2" max="30" value="10"></div><div><label>${t('gLevel')}</label><input id="gL" value="${esc(me.level||'')}" readonly></div><div><label>${t('gSpec')}</label><input id="gS" value="${esc(SPECS[me.spec]||me.spec||'')}" readonly></div></div>
<label>${t('gDesc')}</label><textarea id="gD" maxlength="300" placeholder="${t('gDescPh')}"></textarea><button class="btn" style="margin-top:10px" id="gOk">${t('gCreate')}</button>`);
$('#gOk').onclick=()=>{const name=$('#gN').value.trim();if(name.length<2)return toast(t('gNameErr'));run('group_new',{name,subject:$('#gSu').value,max:+$('#gM').value||10,level:me.level,spec:me.spec,descr:$('#gD').value},d=>{shut();openChat('group:'+d.id,name,t('gStudy'))})}}
function openGroupEl(el){const id=el.dataset.id,name=el.dataset.n,sub=el.dataset.s;if(el.dataset.j==='1')return openChat('group:'+id,name,sub);run('group_join',{id},()=>openChat('group:'+id,name,sub))}
let pF={spec:'',level:'',subject:''};
async function vPartner(){const d=await run('feed',{kind:'partner',...pF});if(!d)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;
$('#main').innerHTML=`<div class="card"><b><i class="fas fa-handshake"></i> ${t('pFind')}</b><div class="card" style="padding:8px;margin:8px 0"><b>${esc(SPECS[me.spec]||me.spec)} · ${esc(me.level)}</b></div><input id="qSu" maxlength="60" placeholder="${t('pSubjPh')}"><textarea id="qB" maxlength="300" style="margin-top:8px" placeholder="${t('pBodyPh')}"></textarea>
<button class="btn" style="margin-top:8px" onclick="newPartner()">${t('pPost')}</button><p class="note">${t('pHint')}</p></div>
<div style="height:10px"></div>${d.length?d.map(p=>postCard(p,1)).join(''):`<div class="empty">${t('noPartner')}</div>`}`}
function newPartner(){const body=$('#qB').value.trim();if(!body)return toast(t('e_empty'));run('post',{kind:'partner',body,level:me.level,spec:me.spec,subject:$('#qSu').value},()=>{toast(t('pPosted'));render()})}
async function vAdmin(){if(!me?.admin)return;const d=await run('admin_list');if(!d)return;
const del=(type,id)=>`<button class="btn sm alt" onclick="adminDelete('${type}','${esc(id)}')"><i class="fas fa-trash"></i> ${t('del')}</button>`;
const post=(d.posts||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${esc(KINDS()[x.kind]||x.kind)}</b><small>${esc(SPECS[x.spec]||x.spec)} · ${esc(x.level)}</small><div class="body">${esc(x.body)}</div>${del('post',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const groups=(d.groups||[]).map(x=>`<div class="card li"><div><b>${esc(x.name)}</b><small>${esc(SPECS[x.spec]||x.spec)} · ${esc(x.level)}</small></div>${del('group',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const msgs=(d.messages||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${esc(x.room)}</b><div class="body">${esc(x.body)}</div>${del('message',x.id)} <button class="btn sm alt" onclick="adminClearRoom('${esc(x.room)}')">${t('clearRoom')}</button></div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const comments=(d.comments||[]).map(x=>`<div class="card"><b>${esc(x.an)} · ${ago(x.t)}</b><div class="body">${esc(x.body)}</div>${del('comment',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const reports=(d.reports||[]).map(x=>`<div class="card"><b>${esc(x.kind||'')}</b> · ${esc(x.target||'')}<div class="body">${esc(x.reason||'')}</div>${del('report',x.id)}</div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
const rooms=(d.rooms||[]).map(x=>`<div class="card li"><div><b>${esc(x.room)}</b><small>${x.messages} · ${ago(x.last_t)}</small></div><button class="btn sm" onclick="openAdminRoom('${esc(x.room)}')">${t('adminOpenRoom')}</button> <button class="btn sm alt" onclick="adminClearRoom('${esc(x.room)}')">${t('clearRoom')}</button></div>`).join('')||`<p class="empty">${t('noAdmin')}</p>`;
$('#main').innerHTML=`<button class="btn" onclick="render()">${t('adminRefresh')}</button><h3>${t('adminPosts')}</h3>${post}<h3>${t('adminGroups')}</h3>${groups}<h3>${t('adminMessages')}</h3>${msgs}<h3>${t('adminRooms')}</h3>${rooms}<h3>${t('adminComments')}</h3>${comments}<h3>${t('adminReports')}</h3>${reports}`}
window.openAdminRoom=function(r){if(!me?.admin)return;openChat(r,r,'');const b=$('#chClear');if(b){b.hidden=false;b.onclick=()=>adminClearRoom(r)}};
window.adminDelete=(type,id)=>{if(!me?.admin||!confirm(t('adminDeleteQ')))return;run('admin_delete',{type,id},()=>{if(type==='message'&&room){const el=document.querySelector('[data-message-id="'+CSS.escape(String(id))+'"]');if(el)el.remove();}else render()})};
window.adminClearRoom=r=>{if(!me?.admin||!confirm(t('adminDeleteQ')))return;run('admin_delete',{type:'room',room:r},()=>{if(room===r)closeChat();render()})};
async function vDms(){const d=await run('dms');if(!d)return $('#main').innerHTML=`<div class="empty">${t('failLoad')}</div>`;
$('#main').innerHTML=d.length?d.map(x=>`<div class="card li" data-id="${esc(x.other)}" data-name="${esc(x.an)}" onclick="openDmEl(this)">${av(x.an,x.avatar)}<div><b>${esc(x.an)}</b><small>${esc(x.body.slice(0,60))} · ${ago(x.t)}</small></div></div>`).join('')+`<p class="note">${t('dmNote')}</p>`:`<div class="empty"><i class="fas fa-comments fa-2x"></i><p>${t('noDms')}</p></div>`}
function openDmEl(el){openDm(el.dataset.id,el.dataset.name)}
function openDm(id,name){if(id===me.id)return toast(t('itsYou'));openChat('dm:'+[me.id,id].sort().join(':'),name,t('dmSub'))}
function openChatEl(el){openChat(el.dataset.room,el.dataset.title,el.dataset.sub)}
function openChat(r,ti,s){room=r;lastId=0;$('#chT').textContent=ti;$('#chS').textContent=s;$('#msgs').innerHTML='';const cb=$('#chClear');cb.hidden=!(me&&me.admin);if(me&&me.admin)cb.onclick=()=>adminClearRoom(r);$('#chat').classList.add('open');pull();clearInterval(timer);timer=setInterval(pull,4000)}
function closeChat(){$('#chat').classList.remove('open');clearInterval(timer);room=null;if(tab==='groups'||tab==='dms')render()}
async function pull(){if(!room||document.hidden)return;const r=room,d=await api('msgs',{room:r,after:lastId}).catch(()=>null);if(!d||d.need_register||r!==room||!d.length)return;const box=$('#msgs'),down=box.scrollHeight-box.scrollTop-box.clientHeight<80||!lastId;
d.forEach(m=>{lastId=Math.max(lastId,m.id);box.insertAdjacentHTML('beforeend',`<div class="m ${m.mine?'me':''}" data-message-id="${m.id}">${m.mine?'':`<b data-id="${esc(m.aid)}" data-name="${esc(m.an)}" onclick="openDmEl(this)">${esc(m.an)}</b>`}${esc(m.body)}${me?.admin?`<button type="button" class="btn sm alt" onclick="adminDelete('message','${m.id}')" title="${t('adminMsgDelete')}"><i class="fas fa-trash"></i></button>`:''}</div>`)});if(down)box.scrollTop=box.scrollHeight}
async function sendMsg(){const i=$('#chIn'),body=i.value.trim();if(!body||!room)return;i.value='';const d=await run('send',{room,body});if(d)pull();else i.value=body}
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
/* توقيع MDA: 3 نقرات سريعة تُظهر رسالة (مثل الصفحة الرئيسية) */
(function(){const s=document.querySelector('.mda-sign');if(!s)return;let n=0,h;s.addEventListener('click',()=>{n++;clearTimeout(h);h=setTimeout(()=>n=0,900);if(n>=3){n=0;toast(t('sign'))}})})();
applyLang();
async function boot(){try{const d=await api('me');if(d&&!d.need_register){me=d;applyLang();render()}else{needLogin()}}catch(e){const m=String(e.message||e);$('#main').innerHTML=`<div class="empty"><i class="fas fa-triangle-exclamation fa-2x"></i><p>${/community_api|PGRST202|schema cache/.test(m)?t('setupFail'):t('connFail')}</p></div>`}}
window.addEventListener('unem:student',()=>{if(!me)boot()});   /* بعد دخول الطالب من البوابة */
boot();
</script></body></html>
