function postCard(p,partner){rem(p.aid,p.an,p.avatar);const sv=saved.includes(p.id),K=KINDS();return `<div class="card${p.pinned?' pinned':''}" id="p${p.id}" data-kind="${esc(p.kind)}"><div class="ph">${av(p.an,p.avatar||(AVC[p.aid]||{}).avatar)}<div style="flex:1"><b>${esc(p.an)}</b>${partner?'':`<span class="tag ${p.kind}">${K[p.kind]||''}</span>`}<small>${ago(p.t)} · ${SPECS[p.spec]||''} · ${p.level||''}${p.subject?' · '+esc(p.subject):''}</small>${postMeta(p)}</div>${p.can_edit?`<button class="btn sm alt" title="${t('edit')}" onclick="editPost('${p.id}')"><i class="fas fa-pen"></i></button>`:''}${p.can_del?`<button class="btn sm alt" title="${t('del')}" onclick="delPost('${p.id}')"><i class="fas fa-trash"></i></button>`:''}</div><div class="body">${esc(p.body)}</div>${p.media_path?`<div class="pimg"><img src="${esc(mediaUrl(p.media_path))}" alt="" loading="lazy" onclick="window.open(this.src,'_blank')"></div>`:''}${admRet('post',p.id,p.pinned)}<div class="acts">${partner?`<button data-id="${esc(p.aid)}" data-name="${esc(p.an)}" onclick="openDmEl(this)"><i class="fas fa-paper-plane"></i> ${t('reply')}</button>${!me?.admin&&p.aid!==me?.id?repBtn('post',p.id,p.aid,p.an):''}`:`<button class="${p.liked?'on':''}" onclick="like('${p.id}')"><i class="fas fa-heart"></i> ${p.likes}</button><button onclick="cms('${p.id}')"><i class="fas fa-comment"></i> ${p.comments}</button><button class="${sv?'on':''}" onclick="save('${p.id}')" style="margin-inline-start:auto"><i class="fas fa-bookmark"></i></button>${!me?.admin&&p.aid!==me?.id?repBtn('post',p.id,p.aid,p.an):''}`}</div><div id="c${p.id}"></div></div>`}

let POST_IMG=null,POST_IMG_URL=null;
function shrinkImage(file,maxDim,q){return new Promise((ok,bad)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{let w=im.naturalWidth,h=im.naturalHeight;const k=Math.min(1,maxDim/Math.max(w,h));w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):bad(Error('bad_media'))},'image/jpeg',q)}catch(e){URL.revokeObjectURL(u);bad(e)}};im.onerror=()=>{URL.revokeObjectURL(u);bad(Error('bad_media'))};im.src=u})}
function clearPostImg(){POST_IMG=null;if(POST_IMG_URL){try{URL.revokeObjectURL(POST_IMG_URL)}catch(e){}POST_IMG_URL=null}const p=$('#pimgPrev');if(p)p.innerHTML='';const f=$('#pimg');if(f)f.value=''}
async function pickPostImg(inp){const f=inp&&inp.files&&inp.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/i.test(f.type)){inp.value='';return toast(t('postImgBad'))}try{const b=await shrinkImage(f,1600,.82);clearPostImg();POST_IMG=new File([b],'post.jpg',{type:'image/jpeg'});POST_IMG_URL=URL.createObjectURL(POST_IMG);const p=$('#pimgPrev');if(p)p.innerHTML=`<img src="${POST_IMG_URL}" alt=""><button type="button" class="btn sm alt" onclick="clearPostImg()"><i class="fas fa-xmark"></i> ${esc(t('postImgRemove'))}</button>`}catch(e){toast(t('postImgBad'))}}
async function newPost(){const body=$('#nb').value.trim(),k=$('#nk .on').dataset.k;if(!body&&!(POST_IMG&&me.admin))return toast(t('e_empty'));let path=null;try{const args={kind:k,body};if(POST_IMG&&me.admin){toast(t('postImgUp'));path='community/'+crypto.randomUUID().replace(/-/g,'')+'_'+Date.now()+'.jpg';const up=await sb.storage.from('community-media').upload(path,POST_IMG,{contentType:'image/jpeg',upsert:false,cacheControl:'86400'});if(up.error)throw up.error;args.media_path=path;args.media_mime='image/jpeg'}const d=await api('post',args);if(d&&d.need_register){setTimeout(needLogin,0);return}notifyActivity('post',d&&d.id);clearPostImg();render()}catch(e){if(path){try{await sb.storage.from('community-media').remove([path])}catch(x){}}showSendError(e)}}

let FR=null,FQ='',FT=[];
const stCard=()=>`<div class="card" id="stCard"><b><i class="fas fa-magnifying-glass"></i> ${t('findT')}</b><p class="note" style="margin-top:6px">${t('findHint')}</p><div class="row" style="margin-top:8px"><input id="stReg" dir="ltr" autocomplete="off" autocapitalize="off" maxlength="40" placeholder="${esc(t('findPh'))}" value="${esc(FQ)}" style="text-align:start"><button class="btn sm" id="stGo" type="button" style="flex:none"><i class="fas fa-search"></i> ${t('findBtn')}</button></div><div id="stRes"></div></div>`;
function stResult(r){
  if(!r)return '';
  if(!r.found)return `<div class="empty" style="padding:16px 6px"><p>${t('findNone')}</p></div>`;
  if(r.id)rem(r.id,r.name,r.avatar);
  const st=r.online?`<span class="st on"><i class="fas fa-circle"></i> ${t('stOnline')}</span>`:(r.active&&r.last_seen?`<span class="st seen"><i class="fas fa-clock"></i> ${t('stSeen',ago(r.last_seen))}</span>`:`<span class="st off"><i class="fas fa-circle"></i> ${t('stInactive')}</span>`);
  return `<div class="card" style="margin:10px 0 0"><div class="ph">${av(r.name,r.avatar)}<div style="flex:1"><b>${esc(r.name)}</b><small>${esc(r.reg||'')} · ${esc(SPECS[r.spec]||r.spec||'')}${r.level?' · '+esc(r.level):''}</small><div class="pmeta">${st}</div></div>${r.registered&&!r.self?`<button type="button" class="btn sm" data-id="${esc(r.id)}" data-name="${esc(r.name)}" onclick="openDmEl(this)"><i class="fas fa-paper-plane"></i> ${t('reply')}</button>`:''}</div>${r.self?`<p class="note">${t('itsYou')}</p>`:''}${r.registered?'':`<p class="note">${t('stInactiveD')}</p>`}</div>`}
function bindFind(){
  const inp=$('#stReg'),btn=$('#stGo'),out=$('#stRes');if(!inp||!btn)return;
  const go=async()=>{const q=(inp.value||'').trim();FQ=q;if(!q)return toast(t('e_empty'));const now=Date.now();FT=FT.filter(x=>now-x<60000);if(FT.length>=4)return toast(t('e_rate'));FT.push(now);btn.disabled=true;const d=await run('find_student',{reg:q});btn.disabled=false;if(d===null)return;FR=d;out.innerHTML=stResult(d)};
  btn.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  if(FR&&FQ){out.innerHTML=stResult(FR);run('find_student',{reg:FQ}).then(d=>{if(d&&document.body.contains(out)){FR=d;out.innerHTML=stResult(d)}})}
}
