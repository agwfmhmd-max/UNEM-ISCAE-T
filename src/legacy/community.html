<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>مجتمع الطلاب | UNEM ISCAE</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0f5132">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--g:#0f5132;--g2:#15803d;--gold:#f5b942;--bg:#f1f5f4;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--soft:#f8fafc;--mine:#fef3c7}
body.dark-mode{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--line:#334155;--soft:#0f172a;--mine:#5b4a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;padding-bottom:30px}
button,input,select,textarea{font:inherit;color:inherit}a{color:inherit;text-decoration:none}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top a,.top button{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
.hero h1{margin:12px 0 4px;font-size:1.6rem;font-weight:800}.hero h1 b{color:var(--gold)}.hero p{margin:0;font-size:.82rem;opacity:.9;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:0 12px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-1px 0 12px;padding:10px 12px 0;background:var(--g);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;color:#d1fae5;padding:10px 14px;border-radius:14px 14px 0 0;font-weight:700;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--g)}body.dark-mode .tabs button.on{color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.78rem;font-weight:700;cursor:pointer}.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}body.dark-mode .chip.on{background:var(--gold);color:#1e293b}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px;outline:none}textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--gold);color:#3b2a00;width:100%}.btn.sm{width:auto;padding:7px 12px;font-size:.78rem}.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.5}
.av{width:36px;height:36px;border-radius:50%;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.ph{display:flex;gap:10px;align-items:center}.ph small{color:var(--mut);display:block;font-size:.72rem}
.tag{font-size:.65rem;background:#dbeafe;color:#1e40af;border-radius:6px;padding:2px 7px;font-weight:800;margin-inline-start:6px}.tag.help{background:#ffedd5;color:#9a3412}.tag.discussion{background:#dcfce7;color:#166534}.tag.announcement{background:#fae8ff;color:#86198f}
.body{margin:10px 0;white-space:pre-wrap;word-break:break-word;line-height:1.8}
.acts{display:flex;gap:14px;color:var(--mut);font-size:.85rem}.acts button{background:none;border:0;cursor:pointer;color:inherit}.acts .on{color:#e11d48}
.cm{background:var(--soft);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:.85rem}.cm b{font-size:.78rem}
.li{display:flex;align-items:center;gap:12px;cursor:pointer}.li .ic{width:44px;height:44px;border-radius:13px;background:#0f172a;color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:.8rem;flex:none}.li div{flex:1;min-width:0}.li small{color:var(--mut);display:block}
.empty{text-align:center;color:var(--mut);padding:30px 10px}.note{font-size:.72rem;color:var(--mut);margin-top:8px}
.ov{position:fixed;inset:0;background:rgba(2,6,23,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}.ov.open{display:flex}
.sheet{background:var(--card);width:min(560px,100%);border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.sheet h3{margin:0 0 10px}.sheet label{font-size:.78rem;font-weight:700;display:block;margin:8px 0 4px}
#chat{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column}#chat.open{display:flex}
.ch{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}.ch button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 11px;cursor:pointer}.ch small{opacity:.75;display:block;font-size:.72rem}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}.m{max-width:80%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:7px 11px;align-self:flex-start;word-break:break-word;white-space:pre-wrap}.m.me{background:var(--mine);align-self:flex-end}.m b{display:block;font-size:.7rem;color:var(--mut);cursor:pointer}
.sb{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}.sb button{width:46px;border:0;border-radius:12px;background:var(--gold);cursor:pointer}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;display:none;font-weight:700;max-width:90vw;text-align:center}
</style></head><body>
<header class="hero"><div class="wrap"><div class="top"><a href="/"><i class="fas fa-arrow-right"></i> الرئيسية</a><button id="meBtn"><i class="fas fa-user-pen"></i> <span id="meName">ملفي</span></button></div>
<h1>مجتمع <b>الطلاب</b></h1><p>نقاش، أسئلة، مجموعات دراسة ورسائل — نص فقط، والرسائل تختفي بعد 24 ساعة.</p></div></header>
<nav class="tabs" id="tabs"></nav>
<main class="wrap" id="main"></main>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div id="chat"><div class="ch"><button onclick="closeChat()"><i class="fas fa-arrow-right"></i></button><div><b id="chT"></b><small id="chS"></small></div></div><div id="msgs"></div>
<div class="sb"><input id="chIn" placeholder="اكتب رسالتك..." maxlength="1000"><button onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button></div></div>
<div id="toast"></div>
<script>
const SB_URL='https://cbaswqaufawdsvadizyi.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNiYXN3cWF1ZmF3ZHN2YWRpenlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4Mzg1MTQsImV4cCI6MjA5MzQxNDUxNH0.tv-u05JTkUFFkdYgR4gUyRb0TZKtDEwEwRQLRQSljHU';
const SPECS={BA:'BA',FC:'FC',TCM:'TCM',GRH:'GRH',SAE:'SAE',IG:'IG',MASTER_FC:'Master FC',MASTER_IG:'Master IG'},LEVELS=['L1','L2','L3','M1','M2'];
const KINDS={question:'سؤال دراسي',help:'مساعدة',discussion:'نقاش',announcement:'إعلان طلابي'};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(localStorage.getItem('unem_theme')==='dark')document.body.classList.add('dark-mode');
let sb;try{sb=supabase.createClient(SB_URL,SB_KEY)}catch(e){}
let TK=localStorage.getItem('unem_community_token');if(!TK){TK=crypto.randomUUID()+crypto.randomUUID();localStorage.setItem('unem_community_token',TK)}
let me=null,tab='posts',fKind='',timer=null,room=null,lastId=0,saved=JSON.parse(localStorage.getItem('unem_community_saved')||'[]');
const ERR={rate:'تمهّل قليلاً قبل المحاولة من جديد',banned:'تم تقييد حسابك في المجتمع',full:'المجموعة ممتلئة',empty:'اكتب نصاً أولاً',not_member:'انضم للمجموعة أولاً'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2800)}
async function api(a,args={}){if(!sb)throw Error('offline');const{data,error}=await sb.rpc('community_api',{p_token:TK,p_action:a,p_args:args});if(error)throw error;return data}
async function run(a,args,ok){try{const d=await api(a,args);if(ok)ok(d);return d}catch(e){const m=String(e.message||e);toast(ERR[Object.keys(ERR).find(k=>m.includes(k))]||(/community_api|PGRST202|schema cache/.test(m)?'المجتمع قيد التفعيل — يلزم تنفيذ ملف SQL في Supabase':'تعذّر الاتصال، حاول مجدداً'));return null}}
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-new Date(t))/6e4));return 'منذ '+(m<60?m+' د':m<1440?Math.round(m/60)+' س':Math.round(m/1440)+' ي')};
const av=n=>`<div class="av" style="background:hsl(${[...String(n)].reduce((s,c)=>s+c.charCodeAt(0),0)*37%360} 45% 32%)">${esc(String(n||'?')[0])}</div>`;
const opts=(o,sel,all)=>(all?`<option value="">${all}</option>`:'')+Object.entries(o).map(([k,v])=>`<option value="${k}"${k==sel?' selected':''}>${v}</option>`).join('');
const lv=Object.fromEntries(LEVELS.map(l=>[l,l]));
function sheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('open')}const shut=()=>$('#ov').classList.remove('open');$('#ov').onclick=e=>{if(e.target.id==='ov'&&me&&me.id)shut()};
function profile(first){sheet(`<h3>${first?'مرحباً بك في مجتمع الطلاب 👋':'ملفي'}</h3><label>الاسم المستعار (يظهر للآخرين)</label><input id="pN" maxlength="24" value="${esc(me?.name||'')}" placeholder="مثال: أحمد">
<div class="row"><div><label>التخصص</label><select id="pS">${opts(SPECS,me?.spec)}</select></div><div><label>المستوى</label><select id="pL">${opts(lv,me?.level)}</select></div></div>
<p class="note">لا حاجة لاسمك الحقيقي. لا تُعرض أرقام الهواتف، والتواصل يتم عبر الرسائل داخل المجتمع.</p><button class="btn" id="pOk">حفظ ومتابعة</button>`);
$('#pOk').onclick=()=>{const name=$('#pN').value.trim();if(name.length<2)return toast('الاسم يجب ألا يقل عن حرفين');run('register',{name,spec:$('#pS').value,level:$('#pL').value},d=>{me=d;$('#meName').textContent=me.name;shut();render()})}}
$('#meBtn').onclick=()=>profile(false);
const TABS=[['posts','المنشورات','fa-newspaper'],['rooms','الغرف','fa-hashtag'],['groups','مجموعات الدراسة','fa-users'],['partner','زميل دراسة','fa-handshake'],['dms','الرسائل','fa-comments']];
function render(){$('#tabs').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()"><i class="fas ${t[2]}"></i> ${t[1]}</button>`).join('');$('#main').innerHTML='<div class="empty"><i class="fas fa-spinner fa-spin"></i></div>';({posts:vPosts,rooms:vRooms,groups:vGroups,partner:vPartner,dms:vDms})[tab]()}
function postCard(p,partner){const sv=saved.includes(p.id);return `<div class="card" id="p${p.id}"><div class="ph">${av(p.an)}<div style="flex:1"><b>${esc(p.an)}</b>${partner?'':`<span class="tag ${p.kind}">${KINDS[p.kind]||''}</span>`}<small>${ago(p.t)} · ${SPECS[p.spec]||''} · ${p.level||''}${p.subject?' · '+esc(p.subject):''}</small></div>
${p.can_del?`<button class="btn sm alt" onclick="delPost('${p.id}')"><i class="fas fa-trash"></i></button>`:`<button class="btn sm alt" onclick="report('post','${p.id}')"><i class="fas fa-flag"></i></button>`}</div><div class="body">${esc(p.body)}</div>
<div class="acts">${partner?`<button onclick="openDm('${p.aid}','${esc(p.an)}')"><i class="fas fa-paper-plane"></i> راسله</button>`:`<button class="${p.liked?'on':''}" onclick="like('${p.id}')"><i class="fas fa-heart"></i> ${p.likes}</button><button onclick="cms('${p.id}')"><i class="fas fa-comment"></i> ${p.comments}</button><button class="${sv?'on':''}" onclick="save('${p.id}')" style="margin-inline-start:auto"><i class="fas fa-bookmark"></i></button>`}</div><div id="c${p.id}"></div></div>`}
async function vPosts(){const d=await run('feed',{kind:fKind});if(!d)return $('#main').innerHTML='<div class="empty">تعذّر تحميل المنشورات</div>';
$('#main').innerHTML=`<div class="card"><div class="ph">${av(me.name)}<div><b>شارك زملاءك</b><small>نص فقط · حتى 3000 حرف</small></div></div><div class="chips" id="nk">${Object.entries(KINDS).map(([k,v],i)=>`<span class="chip${i?'':' on'}" data-k="${k}">${v}</span>`).join('')}</div>
<textarea id="nb" maxlength="3000" placeholder="اكتب سؤالك أو فكرتك أو إعلانك..."></textarea><button class="btn" style="margin-top:8px" onclick="newPost()"><i class="fas fa-paper-plane"></i> نشر</button></div>
<div class="chips"><span class="chip${fKind?'':' on'}" onclick="fKind='';render()">الكل</span>${Object.entries(KINDS).map(([k,v])=>`<span class="chip${fKind==k?' on':''}" onclick="fKind='${k}';render()">${v}</span>`).join('')}</div>${d.length?d.map(p=>postCard(p)).join(''):'<div class="empty"><i class="fas fa-newspaper fa-2x"></i><p>لا توجد منشورات بعد. كن أول من يشارك!</p></div>'}`;
$('#nk').onclick=e=>{if(e.target.dataset.k){document.querySelectorAll('#nk .chip').forEach(c=>c.classList.remove('on'));e.target.classList.add('on')}}}
function newPost(){const body=$('#nb').value.trim(),k=$('#nk .on').dataset.k;if(!body)return toast(ERR.empty);run('post',{kind:k,body},()=>render())}
const delPost=id=>confirm('حذف هذا المنشور؟')&&run('del_post',{id},()=>render());
const like=id=>run('like',{id},()=>render());
const save=id=>{saved=saved.includes(id)?saved.filter(x=>x!=id):[...saved,id];localStorage.setItem('unem_community_saved',JSON.stringify(saved));render()};
function report(kind,target){const reason=prompt('سبب الإبلاغ (اختياري):');if(reason===null)return;run('report',{kind,target,reason},()=>toast('تم إرسال البلاغ للمشرفين'))}
async function cms(id){const box=$('#c'+id);if(box.innerHTML)return box.innerHTML='';const d=await run('comments',{id});if(!d)return;
box.innerHTML=d.map(c=>`<div class="cm"><b>${esc(c.an)}</b> <small style="color:var(--mut)">${ago(c.t)}</small>${c.can_del?` <a href="#" onclick="delCm('${c.id}','${id}');return false" style="color:#e11d48">حذف</a>`:''}<div>${esc(c.body)}</div></div>`).join('')+`<div class="row" style="margin-top:8px"><input id="ci${id}" maxlength="1000" placeholder="اكتب تعليقاً..."><button class="btn sm" style="flex:none" onclick="addCm('${id}')"><i class="fas fa-paper-plane"></i></button></div>`}
const bump=(id,n)=>{const b=document.querySelector(`#p${id} .acts button:nth-child(2)`);if(b)b.lastChild.textContent=' '+Math.max(0,(parseInt(b.textContent)||0)+n)};
const addCm=id=>{const body=$('#ci'+id).value.trim();if(!body)return;run('comment',{id,body},()=>{bump(id,1);$('#c'+id).innerHTML='';cms(id)})};
const delCm=(id,pid)=>run('del_comment',{id},()=>{bump(pid,-1);$('#c'+pid).innerHTML='';cms(pid)});
function vRooms(){const r=[['general','الغرفة العامة','نقاش مفتوح لكل طلاب المعهد','#']].concat(Object.entries(SPECS).map(([k,v])=>['spec:'+k,'غرفة '+v,'نقاش طلاب '+v,v.replace('Master ','M-').slice(0,4)]));
$('#main').innerHTML=`<p class="note">غرف نقاش عامة ومباشرة. الرسائل نصية فقط وتُحذف تلقائياً بعد 24 ساعة.</p>`+r.map(x=>`<div class="card li" onclick="openChat('${x[0]}','${x[1]}','${x[2]}')"><div class="ic">${x[3]}</div><div><b>${x[1]}</b><small>${x[2]}</small></div><i class="fas fa-chevron-left"></i></div>`).join('')}
let gF={spec:'',level:''};
async function vGroups(){const d=await run('groups',gF);if(!d)return $('#main').innerHTML='<div class="empty">تعذّر تحميل المجموعات</div>';
$('#main').innerHTML=`<div class="row"><select onchange="gF.spec=this.value;render()">${opts(SPECS,gF.spec,'كل الشعب')}</select><select onchange="gF.level=this.value;render()">${opts(lv,gF.level,'كل المستويات')}</select></div>
<button class="btn" style="margin:10px 0" onclick="groupForm()">إنشاء مجموعة +</button>`+(d.length?d.map(g=>`<div class="card li" onclick="openGroup('${g.id}',${g.joined},'${esc(g.name).replace(/'/g,'')}','${g.spec||''} · ${g.level||''} · ${g.members} من ${g.max} أعضاء')"><div class="ic"><i class="fas fa-users"></i></div><div><b>${esc(g.name)}</b><small>${esc(g.subject||'')} ${SPECS[g.spec]||''} · ${g.level||''}</small><small>${g.members} من ${g.max} أعضاء${g.descr?' — '+esc(g.descr):''}</small></div><span class="btn sm ${g.joined?'alt':''}">${g.joined?'فتح':'انضمام'}</span></div>`).join(''):'<div class="empty"><i class="fas fa-users fa-2x"></i><p>لا توجد مجموعات دراسة بعد<br>أنشئ أول مجموعة وادعُ زملاءك للمراجعة معاً.</p></div>')}
function groupForm(){sheet(`<h3>مجموعة دراسة جديدة</h3><label>اسم المجموعة</label><input id="gN" maxlength="60" placeholder="مثال: مراجعة Analyse 2"><label>المادة</label><input id="gSu" maxlength="60" placeholder="Analyse, Comptabilité...">
<div class="row"><div><label>الحد الأقصى</label><input id="gM" type="number" min="2" max="30" value="10"></div><div><label>المستوى</label><select id="gL">${opts(lv,me.level)}</select></div><div><label>الشعبة</label><select id="gS">${opts(SPECS,me.spec)}</select></div></div>
<label>وصف (اختياري)</label><textarea id="gD" maxlength="300" placeholder="ماذا ستراجعون؟ متى؟"></textarea><button class="btn" style="margin-top:10px" id="gOk">إنشاء المجموعة</button>`);
$('#gOk').onclick=()=>{const name=$('#gN').value.trim();if(name.length<2)return toast('اكتب اسم المجموعة');run('group_new',{name,subject:$('#gSu').value,max:+$('#gM').value||10,level:$('#gL').value,spec:$('#gS').value,descr:$('#gD').value},d=>{shut();openChat('group:'+d.id,name,'مجموعة دراسة')})}}
function openGroup(id,joined,name,sub){if(joined)return openChat('group:'+id,name,sub);run('group_join',{id},()=>openChat('group:'+id,name,sub))}
let pF={spec:'',level:'',subject:''};
async function vPartner(){const d=await run('feed',{kind:'partner',...pF});if(!d)return $('#main').innerHTML='<div class="empty">تعذّر التحميل</div>';
$('#main').innerHTML=`<div class="card"><b><i class="fas fa-handshake"></i> ابحث عن زميل دراسة</b><div class="row" style="margin:8px 0"><select id="qL">${opts(lv,me.level)}</select><select id="qS">${opts(SPECS,me.spec)}</select></div><input id="qSu" maxlength="60" placeholder="المادة (مثال: Analyse)"><textarea id="qB" maxlength="300" style="margin-top:8px" placeholder="ماذا تريد أن تراجع؟ مثال: أبحث عن طالب لمراجعة Analyse غداً"></textarea>
<button class="btn" style="margin-top:8px" onclick="newPartner()">نشر الطلب</button><p class="note">لا تظهر أرقام الهواتف — التواصل عبر الرسائل الخاصة فقط. الطلب يبقى 14 يوماً.</p></div>
<div class="row"><select onchange="pF.spec=this.value;render()">${opts(SPECS,pF.spec,'كل الشعب')}</select><select onchange="pF.level=this.value;render()">${opts(lv,pF.level,'كل المستويات')}</select></div><div style="height:10px"></div>${d.length?d.map(p=>postCard(p,1)).join(''):'<div class="empty">لا توجد طلبات حالياً</div>'}`}
function newPartner(){const body=$('#qB').value.trim();if(!body)return toast(ERR.empty);run('post',{kind:'partner',body,level:$('#qL').value,spec:$('#qS').value,subject:$('#qSu').value},()=>{toast('تم نشر طلبك');render()})}
async function vDms(){const d=await run('dms');if(!d)return $('#main').innerHTML='<div class="empty">تعذّر التحميل</div>';
$('#main').innerHTML=d.length?d.map(x=>`<div class="card li" onclick="openDm('${x.other}','${esc(x.an)}')">${av(x.an)}<div><b>${esc(x.an)}</b><small>${esc(x.body.slice(0,60))} · ${ago(x.t)}</small></div></div>`).join('')+'<p class="note">الرسائل الخاصة تختفي بعد 24 ساعة.</p>':'<div class="empty"><i class="fas fa-comments fa-2x"></i><p>لا توجد رسائل. ابدأ محادثة من «زميل دراسة» أو بالضغط على اسم طالب في غرفة.</p></div>'}
function openDm(id,name){if(id===me.id)return toast('هذا أنت 🙂');openChat('dm:'+[me.id,id].sort().join(':'),name,'رسالة خاصة · تختفي بعد 24 ساعة')}
function openChat(r,t,s){room=r;lastId=0;$('#chT').textContent=t;$('#chS').textContent=s;$('#msgs').innerHTML='';$('#chat').classList.add('open');pull();clearInterval(timer);timer=setInterval(pull,4000)}
function closeChat(){$('#chat').classList.remove('open');clearInterval(timer);room=null;if(tab==='groups'||tab==='dms')render()}
async function pull(){if(!room||document.hidden)return;const r=room,d=await api('msgs',{room:r,after:lastId}).catch(()=>null);if(!d||r!==room||!d.length)return;const box=$('#msgs'),down=box.scrollHeight-box.scrollTop-box.clientHeight<80||!lastId;
d.forEach(m=>{lastId=Math.max(lastId,m.id);box.insertAdjacentHTML('beforeend',`<div class="m ${m.mine?'me':''}">${m.mine?'':`<b onclick="openDm('${m.aid}','${esc(m.an)}')">${esc(m.an)}</b>`}${esc(m.body)}</div>`)});if(down)box.scrollTop=box.scrollHeight}
async function sendMsg(){const i=$('#chIn'),body=i.value.trim();if(!body||!room)return;i.value='';const d=await run('send',{room,body});if(d)pull();else i.value=body}
$('#chIn').addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg()});
(async()=>{try{const d=await api('me');if(d&&!d.need_register){me=d;$('#meName').textContent=me.name;render()}else{me={name:'',spec:'BA',level:'L1'};$('#main').innerHTML='';profile(true)}}catch(e){const m=String(e.message||e);$('#main').innerHTML=`<div class="empty"><i class="fas fa-triangle-exclamation fa-2x"></i><p>${/community_api|PGRST202|schema cache/.test(m)?'مجتمع الطلاب قيد التفعيل.<br>يلزم تنفيذ ملف db/20261011100000_student_community.sql في Supabase.':'تعذّر الاتصال بالخادم. تحقق من الإنترنت وأعد المحاولة.'}</p></div>`}})();
</script></body></html>
